<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const caracteres = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?";
        function gerarSenha(qtdCaracter){
            const array = new Uint32Array(qtdCaracter);
            window.crypto.getRandomValues(array);

            let senha = "";
            for(let i = 0; i < array.length; i++){
                const indice = array[i] % caracteres.length;
                senha += caracteres[indice];
            }
            return senha;
        }
        function returnSenha(){
            const quantidade = document.getElementById("numberCaracter").value;
            document.getElementById("resultado").value = gerarSenha(quantidade);
        }
    </script>
    <title>Document</title>
</head>
<body>
    <div class="corpo">
        <div class="form">
            <form id="qtdCaracter">
                <label for="numberCaracter">Quantos caracteres deseja em sua senha?</label>
                <input type="number" name="numberCaracter" id="numberCaracter" placeholder="Número de caracteres">
                <button type="button" onclick="returnSenha()">Gerar senha</button>
                <label for="resultado"></label>
                <input type="text" id="resultado" name="resultado" value="senha" readonly>
            </form>
        </div>
    </div>
</body>
</html>
